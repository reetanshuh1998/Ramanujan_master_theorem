[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ramanujan-qft"
version = "0.3.0a3"
description = "Ramanujan's Master Theorem, Mellin residue summation and arbitrary-precision Feynman integrals"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Reet" }]
requires-python = ">=3.9"
dependencies = [
    "mpmath>=1.3.0",
    "sympy>=1.12",
    "numpy>=1.24",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Development Status :: 3 - Alpha",
]

[project.optional-dependencies]
multiloop = ["scipy>=1.10"]
test = ["pytest>=7", "scipy>=1.10"]
benchmarks = ["scipy>=1.10"]

[project.urls]
Homepage = "https://github.com/reetanshuh1998/Ramanujan_master_theorem"
Documentation = "https://reetanshuh1998.github.io/Ramanujan_master_theorem/"
Issues = "https://github.com/reetanshuh1998/Ramanujan_master_theorem/issues"

[tool.setuptools.packages.find]
include = ["ramanujan_qft*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: nested quadratures (seconds each)"]
