name: publish

# Publishes ramanujan-qft to PyPI when a GitHub release is published.
# One-time setup on pypi.org: add a "trusted publisher" for this repository,
# workflow "publish.yml", environment "pypi" (https://docs.pypi.org/trusted-publishers/).

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      include_slow: true

  pypi:
    needs: validate
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
