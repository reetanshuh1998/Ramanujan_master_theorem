name: publish

# Publishes ramanujan-qft to PyPI when a GitHub release is published.
# One-time setup on pypi.org: add a "trusted publisher" for this repository,
# workflow "publish.yml", environment "pypi" (https://docs.pypi.org/trusted-publishers/).

on:
  # Authentication-only preflight; dispatch on the frozen v* candidate tag.
  # No distribution upload. PyPI may activate a pending publisher/project.
  workflow_dispatch:
    inputs:
      index:
        description: Index for authentication only (never uploads files)
        type: choice
        options: [pypi, testpypi]
        default: pypi
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'release'
    uses: ./.github/workflows/validate.yml
    with:
      include_slow: true

  pypi:
    if: github.event_name == 'release'
    needs: validate
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  publisher-preflight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify the selected index trusts this workflow without uploading
        env:
          PYPI_CHECK_INDEX: ${{ inputs.index || 'pypi' }}
        run: python tools/check_pypi_publisher.py --index "$PYPI_CHECK_INDEX"

  install-from-index:
    needs: pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install mpmath sympy numpy
      - name: Install the published version from production PyPI
        run: |
          VERSION=$(python tools/check_release_metadata.py)
          python -m pip install --no-deps --index-url https://pypi.org/simple/ "ramanujan-qft==$VERSION"
      - name: Verify installation outside the checkout
        run: |
          python - <<'PY'
          import os, runpy, subprocess, sys, tempfile
          from pathlib import Path
          namespace = runpy.run_path('tools/smoke_release.py')
          root = str(Path.cwd())
          environment = os.environ.copy()
          environment.pop('PYTHONPATH', None)
          with tempfile.TemporaryDirectory() as directory:
              subprocess.run([sys.executable, '-c', namespace['SMOKE'], root],
                             cwd=directory, env=environment, check=True)
          PY
