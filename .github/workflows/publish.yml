name: publish

# Publishes ramanujan-qft to PyPI when a GitHub release is published.
# One-time setup on pypi.org: add a "trusted publisher" for this repository,
# workflow "publish.yml", environment "pypi" (https://docs.pypi.org/trusted-publishers/).

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build --outdir dist .
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
