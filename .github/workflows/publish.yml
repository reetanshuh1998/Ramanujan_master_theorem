name: publish

# Publishes ramanujan-qft to PyPI when a GitHub release is published.
# One-time setup on pypi.org: add a "trusted publisher" for this repository,
# workflow "publish.yml", environment "pypi" (https://docs.pypi.org/trusted-publishers/).

on:
  # Dispatch on a frozen v* tag. Authentication is the default; only the
  # explicit testpypi-release operation uploads to the test index.
  workflow_dispatch:
    inputs:
      operation:
        description: Authenticate only, or validate and upload to TestPyPI
        type: choice
        options: [authenticate, testpypi-release]
        default: authenticate
      index:
        description: Index for authentication only (never uploads files)
        type: choice
        options: [pypi, testpypi]
        default: pypi
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'testpypi-release')
    uses: ./.github/workflows/validate.yml
    with:
      include_slow: true

  pypi:
    if: github.event_name == 'release'
    needs: validate
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  publisher-preflight:
    if: github.event_name == 'workflow_dispatch' && inputs.operation != 'testpypi-release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify the selected index trusts this workflow without uploading
        env:
          PYPI_CHECK_INDEX: ${{ inputs.index || 'pypi' }}
        run: python tools/check_pypi_publisher.py --index "$PYPI_CHECK_INDEX"

  testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'testpypi-release'
    needs: validate
    runs-on: ubuntu-latest
    # Matches the replacement publisher configured on TestPyPI. The service
    # endpoint is fixed here; the authentication index input cannot change it.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  install-from-index:
    needs: [pypi, testpypi]
    if: always() && (needs.pypi.result == 'success' || needs.testpypi.result == 'success')
    runs-on: ubuntu-latest
    env:
      RELEASE_INDEX: ${{ github.event_name == 'release' && 'https://pypi.org/simple/' || 'https://test.pypi.org/simple/' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --index-url https://pypi.org/simple/ mpmath sympy numpy
      - name: Install the published version from the selected release index
        run: |
          VERSION=$(python tools/check_release_metadata.py)
          python -m pip install --no-deps --index-url "$RELEASE_INDEX" "ramanujan-qft==$VERSION"
      - name: Verify installation outside the checkout
        run: |
          python - <<'PY'
          import os, runpy, subprocess, sys, tempfile
          from pathlib import Path
          namespace = runpy.run_path('tools/smoke_release.py')
          root = str(Path.cwd())
          environment = os.environ.copy()
          environment.pop('PYTHONPATH', None)
          with tempfile.TemporaryDirectory() as directory:
              subprocess.run([sys.executable, '-c', namespace['SMOKE'], root],
                             cwd=directory, env=environment, check=True)
          PY
