name: TestPyPI rehearsal

# Manual only. Configure the separate TestPyPI trusted publisher for this
# workflow and the testpypi GitHub environment before dispatching it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      include_slow: true
  upload:
    needs: validate
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
  install-from-index:
    needs: upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install base dependencies from PyPI
        run: python -m pip install mpmath sympy numpy
      - name: Install this version only from TestPyPI
        run: |
          VERSION=$(python tools/check_release_metadata.py)
          python -m pip install --no-deps --index-url https://test.pypi.org/simple/ "ramanujan-qft==$VERSION"
      - name: Verify the installed version outside the checkout
        run: |
          python - <<'PY'
          import os, runpy, subprocess, sys, tempfile
          from pathlib import Path
          namespace = runpy.run_path('tools/smoke_release.py')
          root = str(Path.cwd())
          environment = os.environ.copy()
          environment.pop('PYTHONPATH', None)
          with tempfile.TemporaryDirectory() as directory:
              subprocess.run([sys.executable, '-c', namespace['SMOKE'], root],
                             cwd=directory, env=environment, check=True)
          PY
