name: docs

# Builds the documentation website (Sphinx) and deploys it to GitHub Pages.
# One-time setup: repository Settings -> Pages -> "Build and deployment" -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package and documentation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[multiloop]" -r docs/requirements.txt
      - name: Build wheel (served to the in-browser "Try it" page)
        run: python -m build --wheel --outdir dist .
      - name: Build HTML (warnings are errors)
        run: python -m sphinx -b html docs docs/_build/html -W --keep-going
      - name: Run the code examples on the documentation pages
        run: python tools/check_doc_snippets.py docs
      - name: Bundle the wheel with the site
        run: |
          mkdir -p docs/_build/html/_static/wheels
          cp dist/*.whl docs/_build/html/_static/wheels/
          python - <<'EOF'
          import glob, json, os
          wheel = os.path.basename(sorted(glob.glob("dist/*.whl"))[-1])
          json.dump({"wheel": wheel}, open("docs/_build/html/_static/wheels/latest.json", "w"))
          EOF
          touch docs/_build/html/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html
          include-hidden-files: true  # Preserve the generated .nojekyll marker.

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
