name: validation

on:
  workflow_call:
    inputs:
      include_slow:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ".[test]"
      - run: python -m pytest -m "not slow" -q
      - name: Docstring examples
        run: python -m pytest -q --doctest-modules ramanujan_qft/rmt.py ramanujan_qft/mellin.py ramanujan_qft/one_loop.py ramanujan_qft/sunset.py
      - name: Slow independent validation
        if: inputs.include_slow && matrix.python-version == '3.13'
        run: python -m pytest -m slow -q

  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - run: python -m pip install -c tests/constraints-minimum.txt ".[test]"
      - run: python -m pip check
      - run: python -m pytest -m "not slow" -q
      - run: python examples/08_first_calculations.py

  audit-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ".[test]" -r docs/requirements.txt
      - run: python tools/audit_sunset.py --output audit-results/sunset_audit.json
      - run: python tools/audit_stability.py --output audit-results/stability_audit.json
      - run: python tools/check_doc_snippets.py docs
      - run: python tools/check_notebook.py notebooks/research_alpha.ipynb
      - run: python tools/check_notebook.py notebooks/stable_walkthrough.ipynb
      - run: python examples/08_first_calculations.py
      - run: python -m sphinx -b html -D plot_gallery=0 -W --keep-going docs docs/_build/html
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: numerical-audit
          path: audit-results/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python tools/check_release_metadata.py
      - name: Verify release tag
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.operation == 'testpypi-release')
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: python tools/check_release_metadata.py --tag "$RELEASE_TAG" --ref "$GITHUB_REF"
      - run: python -m build --outdir dist .
      - run: python -m twine check --strict dist/*
      - run: python tools/check_sdist_contents.py dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  installed-artifacts:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        format: [wheel, sdist]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: python tools/smoke_release.py --dist dist --format ${{ matrix.format }}

  upgrade-from-alpha:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [base, multiloop]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Upgrade from the published alpha outside the checkout
        env:
          OPTIONAL_EXTRA: ${{ matrix.extra }}
        run: |
          EXTRA_FLAG=""
          if [ "$OPTIONAL_EXTRA" = "multiloop" ]; then EXTRA_FLAG="--with-multiloop"; fi
          python tools/smoke_release.py --dist dist --format wheel --upgrade-from 0.3.0a5 $EXTRA_FLAG
